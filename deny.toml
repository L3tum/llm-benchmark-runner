[licenses]
# Allowed licenses — permissive and copyleft
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]

[bans]
# Warn about duplicate crates (multiple versions)
multiple-versions = "warn"

[advisories]
# Block crates with unresolved security advisories
# paste is unmaintained (RUSTSEC-2024-0436) but is a transitive dep of parquet
# with no safe upgrade available — ignore until parquet removes it
ignore = ["RUSTSEC-2024-0436"]
