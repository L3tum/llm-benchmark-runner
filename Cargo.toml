[package]
name = "llm-benchmark-runner"
version = "0.1.0"
edition = "2021"
description = "Benchmark runner for LLM models - MMLU-Pro, KLD, etc."
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
yaml_serde = "0.10"
askama = { version = "0.13", features = ["serde_json"] }
libc = "0.2"  # for process group management (setsid, killpg)
anyhow = "1"
bytes = "1"  # for Bytes type used in download utilities
regex = "1"
rand = "0.8"
dirs = "5"
chrono = "0.4"
async-trait = "0.1"  # for async trait methods
csv = "1.3"
flate2 = "1.0"
base64 = "0.22"
sha2 = "0.10"  # HMAC/SHA-256 download integrity verification (P2-3)
quick-xml = "0.41"
parquet = "54"  # for reading HuggingFace kernel-vuln-dataset-full parquet files
arrow = "54"    # parquet dependency for record batch reading
slug = "0.1"
ctrlc = "=3.4.4"
tempfile = "3.19"  # for temporary directories in multipl_e and swe_bench Docker evaluation

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["signal"] }

[build-dependencies]
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
base64 = "0.22"
sha2 = "0.10"

[features]
renderer-official = [] # requires Node.js on build machine; see README
renderer-lightweight = [] # explicit lightweight renderer (no Node.js required)

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[dev-dependencies]
mockall = "0.11"  # for mocking HTTP client in tests
mockito = "1.2"  # for blocking HTTP server mocking in tests
