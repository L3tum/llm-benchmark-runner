# Model configurations for the benchmark suite.
# Each model is started directly, benchmarked against its local proxy, then stopped.

# ---------------------------------------------------------------------------
# Profiles — pick one by changing the value of profile below, then use
#   benchmarks: !macro [{{profile}}, {}]
# to expand the selected list.
#
#   "all"              — every registered benchmark (60 total, incl. Docker)
#   "all_no_docker"    — all benchmarks that do NOT require Docker (53 total)
# ---------------------------------------------------------------------------
variables:
  profile: "all_no_docker"

macros:
  # Run every registered benchmark.
  all:
    - mmlu_pro
    - supergpqa
    - kld
    - gpqa
    - aime
    - math500
    - minebench
    - carwash
    - fictional_language
    - efficient_language
    - reverse
    - reverse_tools
    - morse_code
    - morse_code_tools
    - base64
    - base64_tools
    - hex
    - hex_tools
    - svg_moonwalk
    - svg_bike
    - minebench_tools
    - ifeval
    - harmbench
    - coding_eval
    - humaneval
    - humaneval_plus
    - mbpp_plus
    - multipl_e
    - swebench
    - swebench_verified
    - swebench_pro
    - swebench_multilingual
    - tool_hallucination
    - terminal_bench
    - stable_toolbench
    - truthful_qa
    - truthful_qa_mc2
    - fever
    - halueval
    - true_false
    - faithdial
    - hdm_bench
    - nq_open
    - triviaqa
    - mmlu_pro_plus
    - mmlu_prox
    - race
    - squad_v2
    - xsum
    - cnn_dailymail
    - ea_mt
    - scifact
    - snli
    - popqa
    - cruxeval
    - ruler
    - halubench
    - bbh
    - factbench
    - truthful_qa_gen

  # All benchmarks that do NOT require Docker containers.
  # Excludes: multipl_e, swebench, swebench_verified, swebench_pro,
  #           swebench_multilingual, terminal_bench, cruxeval
  all_no_docker:
    - mmlu_pro
    - supergpqa
    - kld
    - gpqa
    - aime
    - math500
    - minebench
    - carwash
    - fictional_language
    - efficient_language
    - reverse
    - reverse_tools
    - morse_code
    - morse_code_tools
    - base64
    - base64_tools
    - hex
    - hex_tools
    - svg_moonwalk
    - svg_bike
    - minebench_tools
    - ifeval
    - harmbench
    - coding_eval
    - humaneval
    - humaneval_plus
    - mbpp_plus
    - tool_hallucination
    - stable_toolbench
    - truthful_qa
    - truthful_qa_mc2
    - fever
    - halueval
    - true_false
    - faithdial
    - hdm_bench
    - nq_open
    - triviaqa
    - mmlu_pro_plus
    - mmlu_prox
    - race
    - squad_v2
    - xsum
    - cnn_dailymail
    - ea_mt
    - scifact
    - snli
    - popqa
    - ruler
    - halubench
    - bbh
    - factbench
    - truthful_qa_gen

models:
  - display_name: "MyModel Q4"
    model: "model"  # model name to send to the proxy API (llama-server uses "model")
    cmd: "llama-server -m /path/to/model.Q4.gguf --port 28287"
    proxy: "http://localhost:28287/v1"
    # set_params merges these into every request, overriding benchmark-level params.
    # Useful for temperature, seed, top_p, logprobs, etc.
    set_params:
      temperature: 0.1
      seed: 42
      # logprobs: false  # can override logprobs method's defaults

  - display_name: "MyModel Q5"
    model: "model"
    cmd: "llama-server -m /path/to/model.Q5.gguf --port 28288"
    proxy: "http://localhost:28288/v1"

# Benchmarks to run. Use a profile macro for "all" or "all_no_docker",
# or replace the line below with an explicit list for fine-grained control.
benchmarks:
  !macro [{{profile}}, {}]

# To override with a custom list, replace the line above with explicit entries:
# benchmarks:
#   - mmlu_pro
#   - kld
#   - carwash
#   - ifeval

# Shared runtime settings for benchmarks that execute generated code/tests in Docker.
# build_images auto-builds missing local benchmark images, including the SWE-Bench harness.
docker:
  enabled: true
  default_timeout_secs: 8
  images:
    python: python:3.12
    swebench_harness: llm-benchmark-runner/swebench-harness:latest
  build_images: true
  max_workers: 1
  # SECURITY: Default is false. Mounting the Docker socket gives containers
  # equivalent-to-root access to the host. Only enable if you understand the risk.
  mount_docker_socket: false
  docker_socket_path: /var/run/docker.sock
  # Required when this runner itself runs in Docker with the host Docker socket mounted:
  # host_repo_path: /host/path/to/llm-benchmark-runner

benchmark:
  mmlu_pro:
    num_samples: 100
    # subjects: null  # filter by subjects (comma-separated), null = all
  kld:
    num_prompts: 50
    prompt_source: mmlu
    # custom_prompts_path: null
  minebench:
    # Optional: run several Minebench building prompts
    buildings: [castle, dragon, train]
    # Optional legacy/custom single prompt:
    # build: "A compact test castle"
  humaneval_plus:
    # Requires Docker. Oracle-separated EvalPlus-style evaluation.
    num_samples: 10
    timeout_secs: 8
    enable_pass2: false
    enable_pass3: false
  humaneval:
    # Original HumanEval uses public tests embedded in the dataset.
    num_samples: 10
  mbpp_plus:
    num_samples: 10
  swebench_verified:
    # Requires Docker and a SWE-Bench harness image.
    num_samples: 1
    split: test
    timeout_secs: 1800
  swebench_pro:
    num_samples: 1
    split: test
    timeout_secs: 1800
    token_env: HF_TOKEN
    # dataset_id: SWE-bench/SWE-bench_Pro
  terminal_bench:
    # Agentic terminal benchmark — Docker sandbox, shell tool calls.
    num_samples: 5
    max_iterations: 50
    timeout_secs: 900
    # categories: file_management,shell_commands,debugging,programming,data_processing,linux,other
  stable_toolbench:
    # Tool/API selection and parameter evaluation.
    num_samples: 50
    # subsets: G1_instruction,G1_category,G1_tool,G2_category,G2_instruction,G3_instruction
    # categories: finance,health,shopping,...
  carwash:
    # Simple common-sense reasoning sanity check. No config options needed.
    # Just runs a single "drive vs walk to car wash" prompt and checks the answer.
  ifeval:
    # Instruction-Following Evaluation (IFEval) from Google.
    # Downloads ~1000 prompts with verifiable constraints (word count, keyword rules, etc.).
    # No Docker needed. Fast — runs in a few minutes.
  harmbench:
    # Safety evaluation (base mode — direct harmful prompts only, no Docker).
    # Downloads HarmBench "danger" dataset (~500 harmful behaviors) and sends them as
    # "How to <goal>" prompts. Measures how often the model refuses.
    # enable_extended_execution: false  # default: disabled (not yet implemented)
    # To enable extended jailbreak harness in the future, set to true.
  coding_eval:
    # Backwards-compatible umbrella config shape; prefer the explicit benchmark names above.
    tasksets:
      humaneval_plus: ~
    num_samples: 10
  fictional_language:
    # Fictional language translation benchmark.
    # Three difficulty levels (easy, medium, hard) scored independently + overall.
    # num_samples: 30  # default: all 30 instances (10 per difficulty level)
  efficient_language:
    # Efficient language translation benchmark (symbol substitution).
    # Three difficulty levels (easy, medium, hard) scored independently + overall.
    # num_samples: 30  # default: all 30 instances (10 per difficulty level)
  multipl_e:
    # MultiPL-E: HumanEval translated to 30+ programming languages.
    # Requires Docker for code evaluation.
    # Default languages: all available (31 languages). Filter to a subset if desired:
    # languages: [cs, rs, go, java, js, ts, cpp, py]
    # num_samples: 20  # per language
    # timeout_secs: 30  # per-task evaluation timeout
    # Uses ghcr.io/nuprl/multipl-e-evaluation Docker image for evaluation.

# Comparison groups for generating filtered reports.
# Each comparison produces a standalone benchmark_report.html file containing only the listed models.
# File names are slugified from the title (e.g., "Q4 vs Q5" → "q4-vs-q5.html").
comparisons:
  - title: "Q4 vs Q5"
    models:
      - "MyModel Q4"
      - "MyModel Q5"

# Extensible: add custom benchmark sections here
custom_bench:
  key: "value"